name: Update Scores

on:
  schedule:
    # Every 5 minutes, 6am-10pm (UTC), August 13-16 (tournament days)
    - cron: '*/5 6-22 13-16 8 *'
    # Once daily the rest of August (for late corrections)
    - cron: '0 12 17-31 8 *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Edition year to process'
        default: '2026'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrape Calciosplash API
        run: node scripts/scrape.js
        env:
          YEAR: ${{ github.event.inputs.year || '2026' }}

      - name: Compute player scores
        run: node scripts/compute-scores.js
        env:
          YEAR: ${{ github.event.inputs.year || '2026' }}

      - name: Fetch registered teams
        run: node scripts/fetch-registrations.js
        env:
          YEAR: ${{ github.event.inputs.year || '2026' }}

      - name: Build classifica
        run: node scripts/build-classifica.js
        env:
          YEAR: ${{ github.event.inputs.year || '2026' }}

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/
          git diff --staged --quiet || git commit -m "📊 Auto-update scores $(date -u +%Y-%m-%dT%H:%M)"
          git push

  # The push above is made with GITHUB_TOKEN, and GitHub does not start workflows from those, so
  # the push trigger in deploy.yml never fires for an auto-update. Without this the fresh scores
  # reach the repository and the published site stays on whatever was last pushed by a human.
  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
