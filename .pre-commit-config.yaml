repos:
  # General cleanup, and a guard on the JSON under data/ and assets/, which is what the site
  # actually fetches: a malformed file there is a blank page rather than a stack trace.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        # devcontainer.json is JSONC, which is valid there and not here.
        exclude: ^\.devcontainer/
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets

  # scripts/assign_quotazioni.py is the only Python left. It is run by hand between editions
  # with `uv run`, so it never sees CI, which makes the commit hook the only check it gets.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^scripts/.*\.py$
      - id: ruff-format
        files: ^scripts/.*\.py$

  - repo: local
    hooks:
      - id: node-test
        name: node --test
        entry: npm test
        language: system
        pass_filenames: false
        files: ^(js|scripts|tests|data|assets)/
